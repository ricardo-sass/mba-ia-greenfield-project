services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:worker
    volumes:
      - .:/home/node/app
    environment:
      - DB_HOST=db
      - QUEUE_REDIS_HOST=redis
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=streamtube-videos
      - STORAGE_ACCESS_KEY_ID=streamtube
      - STORAGE_SECRET_ACCESS_KEY=streamtube-minio
      - STORAGE_FORCE_PATH_STYLE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamtube']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube-minio
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 streamtube streamtube-minio &&
      mc mb --ignore-existing local/streamtube-videos
      "
